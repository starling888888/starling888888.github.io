name: Sync Firebase Auth Helpers

on:
  # 毎週月曜 04:00 JST
  # GitHub Actions cron は UTC。
  schedule:
    - cron: "0 19 * * 0"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-firebase-auth-helpers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Firebase variables
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$FIREBASE_API_KEY" ]]; then
            echo "::error::FIREBASE_API_KEY repository variable is not configured."
            exit 1
          fi

          if [[ -z "$FIREBASE_PROJECT_ID" ]]; then
            echo "::error::FIREBASE_PROJECT_ID repository variable is not configured."
            exit 1
          fi

          if [[ -z "$FIREBASE_APP_ID" ]]; then
            echo "::error::FIREBASE_APP_ID repository variable is not configured."
            exit 1
          fi

      - name: Download Firebase Auth helpers
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          source_url="https://${FIREBASE_PROJECT_ID}.firebaseapp.com"
          temp_dir="$(mktemp -d)"

          trap 'rm -rf "$temp_dir"' EXIT

          mkdir -p "$temp_dir/__/auth"

          files=(
            "__/auth/handler"
            "__/auth/handler.js"
            "__/auth/experiments.js"
            "__/auth/iframe"
            "__/auth/iframe.js"
            "__/auth/links"
            "__/auth/links.js"
          )

          for file in "${files[@]}"; do
            echo "Downloading ${file}"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              "${source_url}/${file}" \
              --output "${temp_dir}/${file}"

            if [[ ! -s "${temp_dir}/${file}" ]]; then
              echo "::error::Downloaded file is empty: ${file}"
              exit 1
            fi
          done

          # 全ファイル取得成功後に置換する。
          rm -rf __/auth
          mkdir -p __/auth

          cp -a "$temp_dir/__/auth/." __/auth/

      - name: Generate Firebase init.json
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p __/firebase

          jq -n \
            --arg apiKey "$FIREBASE_API_KEY" \
            --arg authDomain "starling888888.github.io" \
            --arg projectId "$FIREBASE_PROJECT_ID" \
            --arg appId "$FIREBASE_APP_ID" \
            '{
              apiKey: $apiKey,
              authDomain: $authDomain,
              projectId: $projectId,
              appId: $appId
            }' \
            > __/firebase/init.json

          jq -e \
            --arg projectId "$FIREBASE_PROJECT_ID" \
            '.projectId == $projectId' \
            __/firebase/init.json \
            > /dev/null

      - name: Ensure GitHub Pages serves helper paths
        shell: bash
        run: |
          set -euo pipefail
          touch .nojekyll

      - name: Commit synced files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .nojekyll \
            __/auth \
            __/firebase/init.json

          if git diff --cached --quiet; then
            echo "Firebase Auth helpers are already up to date."
            exit 0
          fi

          echo "Firebase Auth helper changes:"
          git diff --cached --stat

          git commit -m "chore: sync Firebase Auth helpers"

          git pull --rebase origin main
          git push origin HEAD:main
