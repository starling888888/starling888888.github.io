name: Sync Firebase Auth Helpers

on:
  # 毎週月曜 04:00 JST
  # GitHub Actions の cron は UTC なので、日曜 19:00 UTC。
  schedule:
    - cron: "0 19 * * 0"

  # Actions画面から手動実行可能。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-firebase-auth-helpers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch for manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::Manual sync must be run from the main branch."
          exit 1

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Firebase variables
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$FIREBASE_API_KEY" ]]; then
            echo "::error::FIREBASE_API_KEY repository variable is not configured."
            exit 1
          fi

          if [[ -z "$FIREBASE_PROJECT_ID" ]]; then
            echo "::error::FIREBASE_PROJECT_ID repository variable is not configured."
            exit 1
          fi

          if [[ -z "$FIREBASE_APP_ID" ]]; then
            echo "::error::FIREBASE_APP_ID repository variable is not configured."
            exit 1
          fi

          echo "Firebase project: $FIREBASE_PROJECT_ID"

      - name: Download Firebase Auth helpers
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          source_url="https://${FIREBASE_PROJECT_ID}.firebaseapp.com"
          temp_dir="$(mktemp -d)"

          trap 'rm -rf "$temp_dir"' EXIT

          mkdir -p "$temp_dir/__/auth"

          #
          # Firebaseでは以下の拡張子なしURLが必要:
          #
          #   /__/auth/handler
          #   /__/auth/iframe
          #   /__/auth/links
          #
          # しかしGitHub Pagesに拡張子なしの実ファイルを配置すると、
          # Content-TypeがHTMLにならずダウンロード扱いになる。
          #
          # そのため実ファイルは .html として保存する。
          # GitHub Pagesは /handler に対して handler.html を配信する。
          #

          html_helpers=(
            "handler"
            "iframe"
            "links"
          )

          for file in "${html_helpers[@]}"; do
            echo "Downloading __/auth/${file} -> ${file}.html"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              "${source_url}/__/auth/${file}" \
              --output "${temp_dir}/__/auth/${file}.html"

            if [[ ! -s "${temp_dir}/__/auth/${file}.html" ]]; then
              echo "::error::Downloaded file is empty: ${file}.html"
              exit 1
            fi
          done

          #
          # JavaScript helperは元のファイル名のまま保存する。
          #

          js_helpers=(
            "handler.js"
            "experiments.js"
            "iframe.js"
            "links.js"
          )

          for file in "${js_helpers[@]}"; do
            echo "Downloading __/auth/${file}"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              "${source_url}/__/auth/${file}" \
              --output "${temp_dir}/__/auth/${file}"

            if [[ ! -s "${temp_dir}/__/auth/${file}" ]]; then
              echo "::error::Downloaded file is empty: ${file}"
              exit 1
            fi
          done

          #
          # すべての取得に成功してから既存helperを置換する。
          #
          # 以前配置した拡張子なしの
          # handler / iframe / links もここで削除される。
          #

          rm -rf __/auth
          mkdir -p __/auth

          cp -a "$temp_dir/__/auth/." __/auth/

          #
          # 最終チェック。
          #

          expected_files=(
            "__/auth/handler.html"
            "__/auth/handler.js"
            "__/auth/experiments.js"
            "__/auth/iframe.html"
            "__/auth/iframe.js"
            "__/auth/links.html"
            "__/auth/links.js"
          )

          for file in "${expected_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Firebase Auth helper is missing or empty: ${file}"
              exit 1
            fi
          done

      - name: Generate Firebase init.json
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p __/firebase

          jq -n \
            --arg apiKey "$FIREBASE_API_KEY" \
            --arg authDomain "starling888888.github.io" \
            --arg projectId "$FIREBASE_PROJECT_ID" \
            --arg appId "$FIREBASE_APP_ID" \
            '{
              apiKey: $apiKey,
              authDomain: $authDomain,
              projectId: $projectId,
              appId: $appId
            }' \
            > __/firebase/init.json

          if ! jq -e \
            --arg projectId "$FIREBASE_PROJECT_ID" \
            --arg authDomain "starling888888.github.io" \
            '
              .projectId == $projectId
              and .authDomain == $authDomain
              and (.apiKey | length > 0)
              and (.appId | length > 0)
            ' \
            __/firebase/init.json \
            > /dev/null; then
            echo "::error::Generated Firebase init.json is invalid."
            exit 1
          fi

      - name: Ensure GitHub Pages serves helper paths
        shell: bash
        run: |
          set -euo pipefail

          # GitHub PagesのJekyll処理を無効化し、
          # __ ディレクトリをそのまま公開する。
          touch .nojekyll

      - name: Show sync result
        shell: bash
        run: |
          set -euo pipefail

          echo "Firebase Auth helper files:"
          find __/auth -maxdepth 1 -type f -printf '%f\n' | sort

          echo
          echo "Firebase init.json:"
          jq \
            '{
              authDomain,
              projectId,
              appId
            }' \
            __/firebase/init.json

      - name: Commit synced files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .nojekyll \
            __/auth \
            __/firebase/init.json

          if git diff --cached --quiet; then
            echo "Firebase Auth helpers are already up to date."
            exit 0
          fi

          echo "Firebase Auth helper changes:"
          git diff --cached --stat

          git commit -m "chore: sync Firebase Auth helpers"

          git pull --rebase origin main
          git push origin HEAD:main
